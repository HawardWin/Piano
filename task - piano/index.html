<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
      <main>
        <div id="keybrd">

            <div id="whtkey">
            <div class="key" data-key="a" id="wkey1">A</div>
            <div class="key" data-key="s" id="wkey2">S</div>
            <div class="key" data-key="d" id="wkey3">D</div>
            <div class="key" data-key="f" id="wkey4">F</div>
            <div class="key" data-key="g" id="wkey5">G</div>
            <div class="key" data-key="h" id="wkey6">H</div>
            <div class="key" data-key="j" id="wkey7">J</div>
            <div class="key" data-key="k" id="wkey8">K</div>
            <div class="key" data-key="l" id="wkey9">L</div>
            <div class="key" data-key="z" id="wkey10">Z</div>
            <div class="key" data-key="m" id="wkey11">M</div>
            <div class="key" data-key="x" id="wkey12">X</div>
            <div class="key" data-key="n" id="wkey13">N</div>
            <div class="key" data-key="n" id="wkey13">N</div>
            <div class="key" data-key="c" id="wkey14">C</div>
            <div class="key" data-key="b" id="wkey15">B</div>
             </div>  

        <div >
            <div  class="blkkey" style="left: 10.5%; top: 0%;" data-blkkey="v">#V</div>
            <div  class="blkkey" style="left: 23.1%; top: 0%;" data-blkkey="r" >#R</div>
            <div  class="blkkey" style="left: 29.5%; top: 0%;" data-blkkey="t">#T</div>
            <div  class="blkkey" style="left: 60.5%; top: 0%;" data-blkkey="y" >#Y</div>
            <div  class="blkkey" style="right: 10.5%; top: 0%;" data-blkkey="u">#U</div>
         </div>

                </div>
   
      </main>

    <script src="script.js"></script>
</body>
</html>
